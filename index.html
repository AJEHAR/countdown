<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ=R Countdown</title>
<meta name="description" content="AZ=R Countdown: live time, notes and up to three countdowns, with phone remote control.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="stage" id="stage"></main>

<nav class="bar" id="bar">
  <div class="grp">
    <button class="btn" data-act="prev" id="b-prev" data-i18n="prev"></button>
    <button class="btn" data-act="next" id="b-next" data-i18n="next"></button>
    <span class="pinfo" id="pinfo"></span>
    <span class="pinfo" id="conn"></span>
    <span class="pinfo" id="snd"></span>
  </div>
  <div class="grp">
    <button class="btn" data-act="startall" data-i18n="startAll"></button>
    <button class="btn" data-act="pauseall" data-i18n="pauseAll"></button>
    <button class="btn danger" data-act="resetall" data-i18n="resetAll"></button>
    <button class="btn" data-act="pair" data-i18n="phone"></button>
    <button class="btn" data-act="fs" data-i18n="fs"></button>
    <button class="btn primary" data-act="edit" data-i18n="settings"></button>
  </div>
</nav>

<div class="overlay settings" id="ed" hidden></div>

<div class="overlay" id="pair" hidden>
  <div class="pair" role="dialog" aria-modal="true" aria-labelledby="pair-h">
    <h2 id="pair-h"></h2>
    <div id="pair-body" style="display:contents"></div>
    <button class="btn" data-act="closepair" id="pair-close"></button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="i18n.js"></script>
<script>window.APP_MODE='display';</script>
<script src="app.js"></script>
</body>
</html>
